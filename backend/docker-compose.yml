version: "3.9"

services:
    postgres-db:
        image: postgis/postgis:16-3.5
        restart: unless-stopped
        environment:
            POSTGRES_DB: linguachat
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d linguachat"]
            interval: 5s
            timeout: 5s
            retries: 10

    api-server:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            postgres-db:
                condition: service_healthy
        env_file:
            - .env
        ports:
            - "3000:3000"
        volumes:
            - .:/usr/src/app
            - node_modules:/usr/src/app/node_modules
        networks:
            - app-network

    adminer: # DB browser visualizer
        image: adminer
        ports:
            - "8080:8080"
        networks:
            - app-network

volumes:
    node_modules:
    postgres-data:

networks:
    app-network:
        driver: bridge
